# ==============================================================================
# Development Environment Profile Configuration (application-dev.yml)
# ==============================================================================

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

application:
  security:
    jwt:
      cookie-secure: false
      cookie-same-site: Lax

logging:
  level:
    root: INFO
    com.fininsight: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
