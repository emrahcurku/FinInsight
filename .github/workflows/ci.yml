name: FinInsight CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-quality-gate:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Run Backend Unit, EDA & AI Tests
        run: ./mvnw test -Dspring.profiles.active=test -Dapplication.ai.provider=mock -Dapplication.ai.enabled=true
        env:
          JWT_SECRET: ci_test_jwt_secret_key_minimum_64_characters_long_for_hs512_verification_gate

      - name: Verify Backend Clean Package
        run: ./mvnw clean package -DskipTests

  frontend-quality-gate:
    name: Frontend Build & Test (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Vitest Test Suite
        run: npm run test

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Build Frontend Production Bundle
        run: npm run build
